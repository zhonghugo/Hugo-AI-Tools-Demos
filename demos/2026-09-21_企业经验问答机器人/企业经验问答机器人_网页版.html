<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业经验问答机器人 · 老员工经验沉淀</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b26a00'/%3E%3Cpath d='M11 21v-9l6 5 6-5v9' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{--primary:#b26a00;--primary-d:#8a5200;--accent:#e0962e;--bg:#f6f3ee;--card:#fff;--line:#e6dfd2;--text:#2b2a26;--muted:#8a8578;--ok:#3c7d43;--warn:#c62828}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:16px}
  header.top{display:flex;align-items:center;gap:12px;padding:14px 4px 4px}
  .logo{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;flex:none}
  header.top h1{font-size:20px;font-weight:700}
  header.top p{color:var(--muted);font-size:12.5px}
  .cols{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(43,42,38,.05)}
  .card h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .count{font-size:12px;color:var(--muted);font-weight:400}
  .search{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px}
  .search:focus{outline:none;border-color:var(--accent)}
  .kblist{max-height:430px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .kbitem{padding:10px 12px;border-bottom:1px solid #f0ebe1;cursor:pointer}
  .kbitem:last-child{border-bottom:none}
  .kbitem:hover{background:#faf6ee}
  .kbitem .q{font-size:13px;font-weight:600}
  .kbitem .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;margin-right:6px}
  .tag.op{background:#fdeecd;color:#8a5200}
  .tag.faq{background:#e4f2e6;color:#2f6b35}
  .tag.tk{background:#e6ecf5;color:#2d4a8a}
  .chat{display:flex;flex-direction:column;height:500px;border:1px solid var(--line);border-radius:12px;background:#fbfaf7;overflow:hidden}
  .msgs{flex:1;overflow:auto;padding:16px}
  .msg{display:flex;gap:10px;margin-bottom:14px}
  .avatar{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
  .avatar.bot{background:linear-gradient(135deg,var(--primary),var(--accent))}
  .avatar.user{background:#5a6675}
  .bubble{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.5px;max-width:82%}
  .msg.user{flex-direction:row-reverse}
  .msg.user .bubble{background:var(--primary);border-color:var(--primary);color:#fff}
  .bubble .src{font-size:11px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
  .bubble .act{font-size:11px;color:var(--warn);margin-top:6px;border-top:1px dashed #f0d8d8;padding-top:5px}
  .input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
  .input input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px}
  .input input:focus{outline:none;border-color:var(--accent)}
  .input button{background:var(--primary);border:none;color:#fff;border-radius:9px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer}
  .input button:hover{background:var(--primary-d)}
  .sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:#fff}
  .sugg button{font-size:12px;padding:5px 10px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--primary-d)}
  .sugg button:hover{border-color:var(--accent);background:#fdf6e9}
  .addcard{margin-top:14px}
  .addcard h2{font-size:14px}
  .form{display:grid;grid-template-columns:110px 130px 1fr;gap:8px}
  .form input,.form select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .form select{background:#fff}
  .form input:focus,.form select:focus{outline:none;border-color:var(--accent)}
  .form .full{grid-column:1/4}
  .form button{grid-column:1/4;background:var(--primary);border:none;color:#fff;border-radius:8px;padding:9px;font-size:13.5px;font-weight:600;cursor:pointer}
  .status{font-size:12px;color:var(--ok);margin-top:8px;min-height:16px}
  footer{margin-top:20px;font-size:12px;color:var(--muted);text-align:center}
  footer b{color:#4b5563}
  @media(max-width:760px){.cols{grid-template-columns:1fr}.chat{height:440px}.form{grid-template-columns:1fr 1fr}.form .full,.form button{grid-column:1/3}}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M8 21v-9l6 5 6-5v9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 7V4.5M14 7V4.5M20 7V4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div>
      <h1>企业经验问答机器人</h1>
      <p>把老员工的操作手册、常见问题、客户话术沉淀成知识库 → 新员工/客户随时问，AI 答不了自动转人工</p>
    </div>
  </header>

  <div class="cols">
    <div>
      <div class="card">
        <h2>企业知识库 <span class="count" id="kbCount"></span></h2>
        <input class="search" id="kbSearch" placeholder="搜索知识条目…">
        <div class="kblist" id="kbList"></div>
      </div>
      <div class="card addcard">
        <h2>沉淀新经验（老员工录入）</h2>
        <div class="form">
          <select id="fCat">
            <option value="op">操作手册</option>
            <option value="faq">常见问题</option>
            <option value="tk">客户话术</option>
          </select>
          <input id="fKw" placeholder="问题/关键词，如：盘点">
          <input id="fAns" placeholder="答案（怎么操作/怎么回复）">
          <button id="fAdd">存入知识库</button>
        </div>
        <div class="status" id="addStatus"></div>
      </div>
    </div>

    <div class="card">
      <h2>问一问（新员工/客户视角）</h2>
      <div class="chat">
        <div class="sugg">
          <button data-q="今晚怎么盘点库存？">今晚怎么盘点库存？</button>
          <button data-q="客户投诉菜咸了怎么处理？">客户投诉菜咸了怎么处理？</button>
          <button data-q="食材快过期了怎么办？">食材快过期了怎么办？</button>
          <button data-q="入职第一天要做什么？">入职第一天要做什么？</button>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="input">
          <input id="qInput" placeholder="输入你的问题，回车发送">
          <button id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </div>

  <footer><b>说明：</b>demo 内置 10 条餐饮零售示例经验，知识库支持新增（localStorage 持久化）；正式版可接向量数据库 + LLM 做语义检索。灵感来自「AI工具资讯日报」9/21（Aiboos 5星）。</footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS = {op:"操作手册", faq:"常见问题", tk:"客户话术"};

/* ===== 预置知识库（餐饮零售示例，可增删，localStorage 持久化） ===== */
const SEED = [
  {cat:"op",  kw:"盘点", ans:"每晚 21:30 打烊后盘点：①按后厨-前厅-库房顺序清点食材 ②在《门店盘点表》登记实际数量 ③与系统库存核对，差异超过 3% 立即上报店长 ④签字确认后发群。每周日晚做一次全品类大盘点。"},
  {cat:"tk",  kw:"投诉 菜咸 难吃 退款", ans:"先道歉安抚情绪，再确认具体问题。方案：①菜品问题→立即重做一份 ②等太久→送饮品或小食 ③坚持退款→按菜单价退或换同等价值券。话术参考：『非常抱歉给您不好的体验，我马上给您重做一份，再送您一份甜品，您看可以吗？』"},
  {cat:"op",  kw:"临期 过期 食材", ans:"临期食材（保质期剩余 ≤1/3）贴黄色标签、放前架优先出清，可做当日特价/员工餐；过期食材一律废弃并登记《损耗单》，禁止二次使用。每月 1 号核对效期。"},
  {cat:"op",  kw:"入职 第一天 新员工", ans:"入职第一天：①领工牌/工服，录指纹 ②读《岗位操作手册》第一章（安全规范） ③跟老员工跟岗 2 小时 ④下午完成线上培训 1-4 节。店长在 17:00 前做入职沟通。"},
  {cat:"op",  kw:"调班 请假", ans:"提前 48 小时在排班系统提交申请，店长审批。调班需自行找到换班人，双方确认后系统互换班次。临时请假（当日）直接电话店长，不得只发消息。"},
  {cat:"faq", kw:"发票", ans:"可以开。个人抬头：提供开票信息后 3 个工作日开出电子发票；企业抬头：需提供税号+开户行账号，当月消费当月开，逾期不补。"},
  {cat:"tk",  kw:"团餐 大单 预订", ans:"团餐/大单预订话术：①先确认人数、餐标、时间、配送/堂食 ②锁定菜单并收 30% 定金 ③提前 1 天确认人数变化（±10% 免费调整）④交付当天提前 30 分钟电话确认。引导话术：『请问大概多少人用餐？我帮您按餐标出两个方案。』"},
  {cat:"op",  kw:"进货 收货 验收", ans:"收货验货三步：①核对送货单与订单（品类/数量/规格） ②检查外包装完整、无破损渗漏 ③抽查生鲜质量（蔬菜无黄叶、肉品温度 ≤4℃），不合格整批拒收并拍照留证。"},
  {cat:"faq", kw:"会员 积分 优惠", ans:"会员积分：消费 1 元积 1 分，100 分抵 1 元，每月 15 号为会员日双倍积分。积分有效期 12 个月。优惠券不可与会员日折扣叠加。"},
  {cat:"op",  kw:"日报 营业 数据", ans:"每日打烊后 30 分钟内交日报：①营业额/订单数/客单价 ②畅销与滞销 TOP3 ③异常项（报损、投诉、设备）④明日备货建议。模板在共享盘《门店日报》文件夹。"}
];
let KB = [];
try { KB = JSON.parse(localStorage.getItem("kb_v1") || "") || []; } catch(e){ KB = []; }
if (!KB.length) { KB = SEED.map(s => ({...s})); saveKB(); }

function saveKB(){ try { localStorage.setItem("kb_v1", JSON.stringify(KB)); } catch(e){} }

/* ===== 知识库渲染 ===== */
function renderKB(filter){
  const f = (filter || "").trim().toLowerCase();
  const list = KB.map((k,i) => ({...k, i})).filter(k => !f || k.kw.toLowerCase().includes(f) || k.ans.toLowerCase().includes(f));
  $("kbCount").textContent = KB.length + " 条";
  $("kbList").innerHTML = list.length ? list.map(k =>
    `<div class="kbitem" data-i="${k.i}">
       <div class="q">${esc(k.kw.split(" ")[0])}${k.kw.includes(" ") ? " 等" : ""}</div>
       <div class="meta"><span class="tag ${k.cat}">${CATS[k.cat]}</span><span onclick="event.stopPropagation();delKB(${k.i})" style="color:#c62828;cursor:pointer">删除</span></div>
     </div>`).join("") : `<div style="padding:14px;font-size:13px;color:var(--muted)">暂无匹配条目</div>`;
  document.querySelectorAll(".kbitem").forEach(el => el.onclick = () => {
    const k = KB[el.dataset.i];
    addMsg("bot", `【${CATS[k.cat]}】${k.kw.split(" ")[0]}\n${k.ans}`, "知识库条目");
  });
}
$("kbSearch").addEventListener("input", e => renderKB(e.target.value));
function delKB(i){ KB.splice(i,1); saveKB(); renderKB($("kbSearch").value); }

/* ===== 问答匹配：关键词计分 ===== */
function match(q){
  const qq = q.toLowerCase();
  let best = null, bestScore = 0;
  KB.forEach(k => {
    const words = k.kw.toLowerCase().split(/\s+/).filter(w => w.length > 1);
    let score = 0;
    words.forEach(w => { if (qq.includes(w)) score += w.length; });
    if (score > bestScore){ bestScore = score; best = k; }
  });
  if (!best) return {hit:false};
  const words = best.kw.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  const full = words.every(w => qq.includes(w));
  return {hit:true, full, item:best, score:bestScore};
}

/* ===== 聊天 ===== */
function addMsg(who, text, src){
  const box = $("msgs");
  const d = document.createElement("div");
  d.className = "msg " + who;
  const lines = text.split("\n");
  d.innerHTML = `<div class="avatar ${who}">${who === "bot" ? "答" : "问"}</div>
    <div class="bubble">${lines.map(esc).join("<br>")}${src ? `<div class="src">来源：${esc(src)}</div>` : ""}</div>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function ask(q){
  if (!q.trim()) return;
  addMsg("user", q.trim());
  const r = match(q);
  if (!r.hit){
    addMsg("bot", "这个问题我还没学到，已自动转给运营经理，预计 10 分钟内回复你。", "转人工");
  } else if (r.full){
    addMsg("bot", `【${CATS[r.item.cat]}】${r.item.ans}`, "知识库命中");
  } else {
    addMsg("bot", `找到一条最接近的经验（${CATS[r.item.cat]}）：\n${r.item.ans}\n\n如果没解决，我可以转给人工。`, "部分匹配");
  }
}
function send(){
  const v = $("qInput").value;
  if (v.trim()){ ask(v); $("qInput").value = ""; }
}
$("sendBtn").onclick = send;
$("qInput").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.querySelectorAll(".sugg button").forEach(b => b.onclick = () => ask(b.dataset.q));

/* ===== 新增经验 ===== */
$("fAdd").onclick = () => {
  const kw = $("fKw").value.trim(), ans = $("fAns").value.trim();
  if (!kw || !ans){ $("addStatus").textContent = "请填写问题关键词和答案。"; return; }
  KB.push({cat:$("fCat").value, kw, ans});
  saveKB(); renderKB($("kbSearch").value);
  $("fKw").value = ""; $("fAns").value = "";
  $("addStatus").textContent = "✓ 已存入知识库（localStorage 持久化）";
};

/* 开场白 */
renderKB("");
addMsg("bot", "你好，我是门店经验问答机器人。老员工的操作经验、常见问题、客户话术都已沉淀在知识库里，你可以直接问我，比如：\n· 今晚怎么盘点库存？\n· 客户投诉菜咸了怎么处理？\n也可以点上方快捷提问。");
</script>
</body>
</html>
