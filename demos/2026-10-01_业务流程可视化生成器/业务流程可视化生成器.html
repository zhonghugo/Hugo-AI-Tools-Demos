<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务流程可视化生成器 · 中文描述一键成图</title>
<style>
:root{
  --bg:#0f1222; --card:#171b30; --card2:#1e2340; --line:#2a3158;
  --fg:#e8ecff; --muted:#8f97c4; --pri:#6c7bff; --pri2:#8b6cff;
  --ok:#2fd98a; --warn:#ffb35c; --bad:#ff6b81; --chip:#232a4d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding:22px}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:22px;letter-spacing:.5px}
h1 .sub{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:6px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:18px 0 14px}
.inp{flex:1;min-width:260px;display:flex;gap:8px}
.inp input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:11px 14px;font-size:14px;outline:none}
.inp input:focus{border-color:var(--pri)}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));border:none;border-radius:10px;color:#fff;padding:11px 20px;font-size:14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--fg)}
.btn:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--fg);transition:.15s}
.chip:hover{border-color:var(--pri);color:#fff}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff}
.main{display:flex;gap:14px;flex-wrap:wrap}
.canvas{flex:1.6;min-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:340px;position:relative;overflow-x:auto}
.side{flex:1;min-width:280px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{font-size:14px;margin-bottom:10px;color:#cdd4ff}
.panel h3 small{color:var(--muted);font-weight:400;font-size:12px}
#flow{display:flex;flex-direction:column;gap:0;padding:8px 2px}
.flow-row{display:flex;align-items:center;gap:10px}
.node{background:linear-gradient(135deg,#232a55,#2a2f5e);border:1px solid var(--line);border-radius:12px;padding:14px 12px;min-width:150px;flex:1;cursor:pointer;transition:.18s;position:relative}
.node:hover{transform:translateY(-2px);border-color:var(--pri)}
.node .n{font-size:12px;color:var(--pri);font-weight:700;letter-spacing:.5px}
.node .t{font-size:14px;font-weight:600;margin-top:4px}
.node .d{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.node .tag{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 7px;border-radius:99px;background:#1b2040;color:var(--muted);border:1px solid var(--line)}
.node.hl{border-color:var(--ok);box-shadow:0 0 0 2px rgba(47,217,138,.25)}
.arrow{color:var(--muted);font-size:16px;flex-shrink:0;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.empty{color:var(--muted);text-align:center;padding:70px 20px;font-size:14px;line-height:2}
.detail{font-size:13px;line-height:2;color:var(--fg)}
.detail .kv{display:flex;gap:8px}
.detail .kv b{color:var(--pri);min-width:70px;font-weight:600}
.detail .risk{color:var(--warn)}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);background:#141830;border:1px solid var(--line);border-radius:10px;padding:12px;height:120px;overflow-y:auto;line-height:1.8}
.log .ok{color:var(--ok)} .log .w{color:var(--warn)} .log .p{color:var(--pri)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.alert{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.7}
@media(max-width:720px){ .flow-row{flex-direction:column;align-items:stretch} .arrow{transform:rotate(90deg);text-align:center;padding:2px 0} .node{min-width:0} }
</style>
</head>
<body>
<div class="wrap">
  <h1>业务流程可视化生成器
    <span class="sub">输入一句中文，把业务流程变成可点击的交互式流程图 · 源自 Archify（AI 技能：自然语言生成架构图/工作流图）</span>
  </h1>

  <div class="top">
    <div class="inp">
      <input id="desc" placeholder="用中文描述流程，如：订单从下单到发货的完整流程" />
      <button class="btn" onclick="run()">生成流程图</button>
    </div>
    <button class="btn ghost" onclick="resetAll()">重置</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="main">
    <div class="canvas">
      <div id="flow"><div class="empty">👆 输入流程描述或点上方预设模板，生成交互式流程图</div></div>
    </div>
    <div class="side">
      <div class="panel">
        <h3>环节详情 <small>点击流程图中的节点查看</small></h3>
        <div class="detail" id="detail">点击任意环节查看：负责人、耗时、触发条件、常见卡点</div>
      </div>
      <div class="panel">
        <h3>生成过程 <small>AI 思考链</small></h3>
        <div class="log" id="log"></div>
      </div>
      <div class="acts">
        <button class="btn ghost" onclick="exportTxt()">导出流程描述</button>
        <button class="btn ghost" onclick="exportSvg()">导出 SVG</button>
      </div>
      <div class="alert">单文件 HTML：解析与渲染全部在本地完成，不联网、可转发、可嵌入作品集。</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ─────────── 内置模板：节点 = {t:名称, d:说明, time:耗时, owner:负责人, trig:触发条件, risk:常见卡点/风险} ─────────── */
const TPL = {
  "订单履约流程": [
    {t:"客户下单", d:"客户在商城提交订单并完成支付", time:"5 分钟", owner:"客户 / 商城系统", trig:"订单状态变为「已支付」", risk:"支付超时导致订单作废"},
    {t:"订单审核", d:"系统自动校验库存与优惠规则，异常订单转人工", time:"0.5–2 小时", owner:"订单中心（自动+人工）", trig:"支付成功后自动触发", risk:"超卖、优惠叠加错误"},
    {t:"仓库拣货", d:"拣货员按波次领取任务，扫码核对商品", time:"1–3 小时", owner:"仓库拣货组", trig:"审核通过后自动生成拣货单", risk:"库存不实、拣错货"},
    {t:"打包出库", d:"二次扫码校验后打包，生成物流面单", time:"0.5–1 小时", owner:"仓库打包组", trig:"拣货完成自动流转", risk:"漏检、错发"},
    {t:"物流配送", d:"快递揽收运输，系统同步物流轨迹", time:"1–3 天", owner:"第三方物流", trig:"面单交接给快递员", risk:"丢件、延误、地址错误"},
    {t:"签收确认", d:"客户签收，系统自动确认收货并触发评价邀请", time:"即时", owner:"客户 / 售后系统", trig:"物流回传签收信息", risk:"拒收、破损退换"}
  ],
  "财务月度对账流程": [
    {t:"数据导出", d:"从银行、开票系统、报销系统导出当月流水", time:"30 分钟", owner:"财务专员", trig:"每月 1 号自动提醒", risk:"数据口径不一致、漏导"},
    {t:"销售开票核对", d:"按客户核对销售订单与开票金额是否一致", time:"2–4 小时", owner:"应收会计", trig:"流水齐备后开始", risk:"折扣未冲销、重复开票"},
    {t:"费用报销核对", d:"核对报销单据与银行支出、预算科目", time:"2–3 小时", owner:"费用会计", trig:"开票核对完成后", risk:"超预算、单据缺失"},
    {t:"差异调整", d:"标记差异项，逐笔查明原因并生成调整分录", time:"1–2 天", owner:"总账会计", trig:"差异清单确认后", risk:"调错科目、跨期差异"},
    {t:"对账报告输出", d:"汇总差异与调整结果，输出月度对账报告", time:"1 小时", owner:"财务经理", trig:"差异清零或挂账说明后", risk:"报告口径与审计要求不符"}
  ],
  "报销审批流程": [
    {t:"提交报销单", d:"员工填写费用明细并上传发票附件", time:"10 分钟", owner:"报销人", trig:"费用发生后 30 天内", risk:"发票不合规、金额超限"},
    {t:"部门经理审批", d:"核对业务真实性，确认预算可用", time:"0.5–1 天", owner:"部门经理", trig:"单据提交后自动通知", risk:"超预算仍需特批"},
    {t:"财务合规审核", d:"查验发票真伪、科目与政策符合性", time:"0.5–1 天", owner:"财务审核岗", trig:"部门审批通过后", risk:"发票重复、政策变更"},
    {t:"财务复核打款", d:"复核金额与收款账户，提交银行打款", time:"0.5 天", owner:"出纳 / 财务复核", trig:"合规审核通过后", risk:"账户错误、重复打款"},
    {t:"凭证归档", d:"自动生成记账凭证并归档原始单据", time:"即时", owner:"系统自动", trig:"打款成功回传", risk:"凭证附件缺失"}
  ]
};
/* 模板名 → 用于匹配用户描述的关键词 */
const TPL_KEY = {
  "订单履约流程": ["订单","下单","发货","履约"],
  "财务月度对账流程": ["对账","财务","月结","流水"],
  "报销审批流程": ["报销","审批","费用"]
};
const SPLIT = /[，。；;、\n]+|然后|接着|再|最后|→|->|=>/g;

const $ = id => document.getElementById(id);
let cur = null;            // 当前流程节点数组
let logLines = [];

function log(msg, cls){ logLines.push({msg, cls}); const el = $("log");
  el.innerHTML += `<div class="${cls}">· ${msg}</div>`; el.scrollTop = el.scrollHeight; }

/* 解析中文描述 → 节点数组：先按连接词切分步骤，步骤足够多则走自定义解析；否则尝试模板匹配兜底 */
function parse(desc){
  const t = desc.trim();
  if(!t){ return null; }
  const parts = t.split(SPLIT).map(s => s.trim()).filter(s => s.length >= 2);
  if(parts.length >= 3){
    return parts.map((p, i) => ({
      t: p.length > 22 ? p.slice(0, 22) + "…" : p,
      d: p, time: i === 0 ? "即时" : "视业务而定", owner: "按实际角色配置",
      trig: i === 0 ? "流程启动" : "上一环节完成后自动流转", risk: "未配置，可点击节点补充"
    }));
  }
  for(const name in TPL_KEY){
    if(TPL_KEY[name].some(k => t.includes(k))){ return JSON.parse(JSON.stringify(TPL[name])); }
  }
  return parts.length ? parts.map((p, i) => ({
    t: p, d: p, time: "视业务而定", owner: "按实际角色配置",
    trig: i === 0 ? "流程启动" : "上一环节完成后自动流转", risk: "未配置，可点击节点补充"
  })) : null;
}

function render(nodes){
  cur = nodes;
  const flow = $("flow");
  if(!nodes || !nodes.length){ flow.innerHTML = `<div class="empty">未识别到流程步骤，请用「→」「然后」「最后」等连接词描述</div>`; return; }
  flow.innerHTML = nodes.map((n, i) => `
    <div class="flow-row">
      <div class="node" data-i="${i}" onclick="showDetail(${i})">
        <span class="n">环节 ${String(i+1).padStart(2,"0")}</span>
        <div class="t">${n.t}</div>
        <div class="d">${n.d}</div>
        <span class="tag">${n.time}</span>
      </div>
      ${i < nodes.length - 1 ? '<div class="arrow">➤</div>' : ''}
    </div>`).join("");
  log(`已生成 ${nodes.length} 个环节的交互式流程图`, "ok");
  showDetail(0);
}

function showDetail(i){
  const n = cur[i];
  const els = document.querySelectorAll(".node");
  els.forEach(e => e.classList.remove("hl"));
  if(els[i]) els[i].classList.add("hl");
  $("detail").innerHTML = `
    <div class="kv"><b>环节</b><span>${n.t}</span></div>
    <div class="kv"><b>说明</b><span>${n.d}</span></div>
    <div class="kv"><b>耗时</b><span>${n.time}</span></div>
    <div class="kv"><b>负责人</b><span>${n.owner}</span></div>
    <div class="kv"><b>触发条件</b><span>${n.trig}</span></div>
    <div class="kv risk"><b>常见卡点</b><span>${n.risk}</span></div>`;
}

function run(){
  const desc = $("desc").value;
  log(`收到描述：「${desc.trim() || "（未输入，使用当前模板）"}」`, "p");
  const nodes = parse(desc || $("desc").placeholder);
  render(nodes);
  log(`解析完成：识别出 ${nodes.length} 个环节，开始渲染`, "w");
}

function loadTpl(name){
  $("desc").value = TPL[name].map(n => n.t).join(" → ");
  const nodes = JSON.parse(JSON.stringify(TPL[name]));
  log(`载入预设模板「${name}」`, "p");
  render(nodes);
}

function resetAll(){ cur = null; $("flow").innerHTML = '<div class="empty">👆 输入流程描述或点上方预设模板，生成交互式流程图</div>';
  $("detail").innerHTML = "点击任意环节查看：负责人、耗时、触发条件、常见卡点";
  $("log").innerHTML = ""; logLines = []; $("desc").value = ""; }

function exportTxt(){
  if(!cur){ alert("请先生成流程图"); return; }
  const txt = "【业务流程】\n" + cur.map((n,i) => `${i+1}. ${n.t}（${n.time}，负责人：${n.owner}）`).join("\n") + "\n\n【风险提示】\n" + cur.map((n,i) => `  环节${i+1} ${n.t}：${n.risk}`).join("\n");
  navigator.clipboard ? navigator.clipboard.writeText(txt).then(()=>log("流程描述已复制到剪贴板","ok")) : null;
  log("导出流程描述文本", "p");
}

function exportSvg(){
  if(!cur){ alert("请先生成流程图"); return; }
  const w = Math.max(560, cur.length * 210), h = 220;
  const ns = "http://www.w3.org/2000/svg";
  let body = "";
  cur.forEach((n,i) => {
    const x = 40 + i*210;
    body += `<rect x="${x}" y="50" width="180" height="92" rx="12" fill="#232a55" stroke="#6c7bff" stroke-width="1.5"/>`;
    body += `<text x="${x+90}" y="74" text-anchor="middle" fill="#8b6cff" font-size="11" font-family="sans-serif">环节 ${String(i+1).padStart(2,"0")}</text>`;
    body += `<text x="${x+90}" y="98" text-anchor="middle" fill="#e8ecff" font-size="14" font-family="sans-serif">${n.t.length>12?n.t.slice(0,12)+"…":n.t}</text>`;
    body += `<text x="${x+90}" y="120" text-anchor="middle" fill="#8f97c4" font-size="11" font-family="sans-serif">${n.time}</text>`;
    if(i < cur.length-1){
      body += `<path d="M ${x+190} 96 L ${x+210} 96" stroke="#8f97c4" stroke-width="2" marker-end="url(#ar)"/>`;
    }
  });
  const svg = `<svg xmlns="${ns}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="background:#0f1222">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8f97c4"/></marker></defs>
  ${body}</svg>`;
  const blob = new Blob([svg], {type:"image/svg+xml;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "业务流程流程图.svg"; a.click();
  log("已导出 SVG 流程图", "ok");
}

/* 预设模板 chips */
(() => {
  const box = $("chips");
  Object.keys(TPL).forEach(name => {
    const c = document.createElement("button");
    c.className = "chip"; c.textContent = name;
    c.onclick = () => { document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); c.classList.add("on"); loadTpl(name); };
    box.appendChild(c);
  });
  log("就绪：内置 3 个流程模板，支持自然语言描述解析", "w");
})();
</script>
</body>
</html>
